name: Refresh project stars

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Read public project metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update-stars.py

      - name: Commit refreshed counts
        run: |
          if git diff --quiet -- README.md README.zh-CN.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md
          git commit -m 'docs: refresh project stars [skip ci]'
          git push
